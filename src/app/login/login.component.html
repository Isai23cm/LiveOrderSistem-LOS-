<main class="login-page">
  <section class="login-card">
    <div class="login-card__stripe"></div>

    <div class="login-card__body">
      <svg class="logo" viewBox="0 0 64 56" aria-hidden="true">
        <!-- tenedor -->
        <g fill="#C2522B">
          <rect x="10" y="4" width="3" height="16" rx="1.5" />
          <rect x="16" y="4" width="3" height="16" rx="1.5" />
          <rect x="22" y="4" width="3" height="16" rx="1.5" />
          <path d="M10 18h15v4a7 7 0 0 1-5 6.7V46a2.5 2.5 0 0 1-5 0V28.7A7 7 0 0 1 10 22z" />
        </g>
        <!-- taza -->
        <path d="M32 14h22v14a11 11 0 0 1-11 11 11 11 0 0 1-11-11z" fill="#2F6B4F" />
        <path d="M54 18h3a5 5 0 0 1 0 10h-3" fill="none" stroke="#E8863A" stroke-width="3" />
        <ellipse cx="43" cy="14" rx="11" ry="2.5" fill="#E8863A" />
        <rect x="14" y="50" width="36" height="3" rx="1.5" fill="#2F6B4F" />
      </svg>

      <h1 class="login-card__title">Gestión &amp; Pedidos</h1>
      <p class="login-card__subtitle">Acceso al Sistema</p>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <div class="input">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
          <input id="email" type="email" placeholder="ejemplo@correo.com" />
        </div>
      </div>

      <div class="field">
        <div class="field__row">
          <label for="password">Contraseña</label>
          <a href="#" class="link-small">mostrar</a>
        </div>
        <div class="input">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
          </svg>
          <input id="password" type="password" value="••••••••" />
          <svg class="input__eye" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </div>
        <a href="#" class="link-small link-small--right">Olvidé mi contraseña</a>
      </div>

      <button type="button" class="btn-login">Iniciar Sesión</button>

      <p class="login-card__footer">Universidad Tecnológica del Sur de Sonora</p>
    </div>
  </section>
</main>
